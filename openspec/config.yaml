schema: spec-driven

context: |
  Tech stack: Python, FastAPI, Pydantic
  Domain: e-commerce cart kata (learning project)
  Testing: TDD, pytest, fakes over mocks
  Architecture: hexagonal-ish, Protocols for external dependencies (repository, LLM extraction, catalog)
  Conventions: type hints, small incremental changes

rules:
  proposal:
    - Keep proposals scoped to one feature at a time
    - Always include a "Non-goals" section
  tasks:
    - Break tasks into small, independently testable units